name: Release Windows EXE

on:
  push:
    tags:
      - "v*"
    paths:
      - "VERSION"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          } else {
            $version = (Get-Content VERSION -Raw).Trim()
          }

          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "VERSION must look like v1.0.0. Found: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name ATR1000_Protection_Monitor `
            atr1000_tci_protection_monitor_v6_no_login.py

      - name: Create tag if needed
        if: github.ref_type != 'tag'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          if (git ls-remote --tags origin "refs/tags/$version" | Select-String $version) {
            Write-Host "Tag $version already exists."
          } else {
            git tag $version
            git push origin $version
          }

      - name: Create GitHub Release and upload EXE
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          if (gh release view $version *> $null) {
            gh release upload $version "dist/ATR1000_Protection_Monitor.exe" --clobber
          } else {
            gh release create $version `
              "dist/ATR1000_Protection_Monitor.exe" `
              --target "${{ github.sha }}" `
              --title "ATR1000 Protection Monitor $version" `
              --generate-notes
          }
